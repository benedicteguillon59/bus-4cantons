name: Mise à jour des horaires et publication

# Chaque jour : régénère data.json, l'enregistre dans le dépôt et republie le site GitHub Pages.
# Si un second hébergeur (ex. Cloudflare Pages) est relié au dépôt, il se met à jour
# tout seul dès que data.json change : les deux adresses restent identiques.

on:
  schedule:
    - cron: "17 3 * * *"      # chaque jour vers 4 h (heure de Paris)
  workflow_dispatch:           # bouton « Run workflow » manuel
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Régénérer data.json (horaires Région + calendrier scolaire + navette Flexity)
        run: python build_data.py
      - name: Enregistrer data.json s'il a changé
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "Mise à jour des horaires"
          git push || true
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - uses: actions/deploy-pages@v5
