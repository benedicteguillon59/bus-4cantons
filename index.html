<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bus 4 Cantons</title>
<meta name="theme-color" content="#4f7053">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
  :root {
    --bg:#f2f5f9; --card:#fff; --text:#16202b; --muted:#65727f; --line:#e1e7ee;
    --brand:#00427a; --brand-text:#fff; --ok:#1a7f37; --late:#c2410c; --warn-bg:#fff4d6; --warn-text:#6b4e00;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0e141b; --card:#18212b; --text:#e8eef4; --muted:#93a1af; --line:#26313d;
            --brand:#4da3ff; --brand-text:#06213b; --ok:#4ade80; --late:#fb923c; --warn-bg:#3a2f0b; --warn-text:#f5d77a; }
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; background:var(--bg); color:var(--text);
    font:16px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  body { padding:0 0 env(safe-area-inset-bottom); min-height:100vh; }
  header { position:sticky; top:0; z-index:5; background:var(--bg); padding:12px 16px 10px; border-bottom:1px solid var(--line); }
  h1 { font-size:1.05rem; margin:0 0 10px; display:flex; justify-content:space-between; align-items:baseline; gap:8px; }
  h1 small { font-weight:400; color:var(--muted); font-size:.8rem; }
  .tabs { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .tabs button { border:2px solid var(--line); background:var(--card); color:var(--text); border-radius:14px;
    padding:12px 8px; font:inherit; font-weight:600; line-height:1.2; }
  .tabs button small { display:block; font-weight:400; color:var(--muted); font-size:.75rem; margin-top:2px; }
  .tabs button[aria-pressed="true"] { background:var(--brand); border-color:var(--brand); color:var(--brand-text); }
  .tabs button[aria-pressed="true"] small { color:inherit; opacity:.85; }
  main { padding:12px 16px 24px; max-width:640px; margin:0 auto; }
  .notice { background:var(--warn-bg); color:var(--warn-text); border-radius:12px; padding:10px 12px; margin:0 0 12px; font-size:.88rem; }
  ul { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:10px; }
  li { background:var(--card); border-radius:16px; padding:12px 14px; display:grid; grid-template-columns:auto 1fr auto; gap:4px 12px; align-items:center;
       box-shadow:0 1px 2px rgba(0,0,0,.06); }
  .badge { min-width:44px; text-align:center; padding:6px 8px; border-radius:10px; font-weight:800; font-size:1.05rem; }
  .place { font-weight:600; }
  .sub { color:var(--muted); font-size:1rem; grid-column:1 / -1; border-top:1px solid var(--line); padding-top:8px; margin-top:4px; }
  .sub b { color:var(--text); font-size:1.15rem; font-weight:700; }
  .nw { white-space:nowrap; }
  .sub small { font-size:.82rem; }
  .when { text-align:right; }
  .mins { font-size:1.5rem; font-weight:800; line-height:1; }
  .clock { color:var(--muted); font-size:.85rem; margin-top:2px; white-space:nowrap; }
    .late { color:var(--late); font-weight:600; }
  .tag { display:inline-block; font-size:.72rem; font-weight:700; padding:1px 7px; border-radius:99px; border:1px solid currentColor; margin-left:4px; vertical-align:1px; }
  .when-bar { margin-top:10px; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .when-bar button { border:2px solid var(--line); background:var(--card); color:var(--text); border-radius:12px; padding:8px 12px; font:inherit; font-size:.9rem; font-weight:600; }
  .when-bar button[aria-pressed="true"] { border-color:var(--brand); color:var(--brand); }
  .when-bar input { border:2px solid var(--line); background:var(--card); color:var(--text); border-radius:12px; padding:7px 8px; font:inherit; font-size:1rem; min-width:0; }
  #custom { display:none; gap:8px; flex:1 1 100%; }
  #custom.on { display:flex; }
  #custom input[type=date] { flex:1 1 55%; } #custom input[type=time] { flex:1 1 35%; }
  .hello { background:linear-gradient(135deg,#ffe3ef,#e6ecff); color:#2b2340; border-radius:16px; padding:12px 14px; margin:0 0 12px; display:flex; gap:10px; align-items:center; cursor:pointer; }
  @media (prefers-color-scheme: dark) { .hello { background:linear-gradient(135deg,#3b2a44,#1f2a4a); color:#f3eaff; } }
  .hello .emo { font-size:1.8rem; line-height:1; }
  .hello p { margin:0; font-size:.95rem; line-height:1.35; }
  .hello p b { display:block; font-size:.8rem; opacity:.7; font-weight:600; margin-bottom:2px; }
  .empty { text-align:center; color:var(--muted); padding:40px 0; }
  footer { text-align:center; color:var(--muted); font-size:.78rem; padding:0 16px 24px; }
  footer button { font:inherit; color:var(--brand); background:none; border:0; text-decoration:underline; padding:4px; }

  /* ===== Décor joyeux ===== */
  :root { --pink:#ff5fa2; --violet:#7c5cff; --mint:#3ddbb0; --sun:#ffc94d; }
  html,body { font-family:"Nunito","Trebuchet MS",ui-rounded,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  body { background:
      radial-gradient(circle at 12% 8%, rgba(255,201,77,.35) 0 90px, transparent 91px),
      radial-gradient(circle at 92% 22%, rgba(255,95,162,.25) 0 120px, transparent 121px),
      radial-gradient(circle at 8% 78%, rgba(61,219,176,.25) 0 110px, transparent 111px),
      linear-gradient(160deg,#fff1f7 0%,#eef1ff 50%,#e8fbf5 100%) fixed; }
  @media (prefers-color-scheme: dark) {
    body { background:
      radial-gradient(circle at 12% 8%, rgba(255,201,77,.12) 0 90px, transparent 91px),
      radial-gradient(circle at 92% 22%, rgba(255,95,162,.14) 0 120px, transparent 121px),
      radial-gradient(circle at 8% 78%, rgba(61,219,176,.12) 0 110px, transparent 111px),
      linear-gradient(160deg,#1b1330 0%,#131a3a 50%,#0f2a2c 100%) fixed; }
  }
  header { background:linear-gradient(135deg,rgba(255,255,255,.85),rgba(255,236,246,.85)); backdrop-filter:blur(8px);
    border-bottom:0; box-shadow:0 4px 18px rgba(124,92,255,.15); border-radius:0 0 22px 22px; }
  @media (prefers-color-scheme: dark) { header { background:linear-gradient(135deg,rgba(35,27,64,.9),rgba(28,24,58,.9)); } }
  h1 span::before { content:"🚌 "; display:inline-block; animation:wiggle 3.2s ease-in-out infinite; transform-origin:70% 80%; }
  h1 span { font-size:1.15rem; font-weight:800; }
  .tabs button { border:2px solid transparent; box-shadow:0 2px 8px rgba(0,0,0,.08); transition:transform .15s, box-shadow .15s; }
  .tabs button:active { transform:scale(.97); }
  .tabs button[aria-pressed="true"] { background:linear-gradient(135deg,var(--violet),var(--pink)); color:#fff; border-color:transparent; box-shadow:0 6px 16px rgba(124,92,255,.4); }
  .tabs button[aria-pressed="true"] small { color:#fff; }
  .when-bar button { border-radius:99px; border-color:transparent; box-shadow:0 2px 6px rgba(0,0,0,.08); }
  .when-bar button[aria-pressed="true"] { background:var(--mint); color:#053b2e; border-color:transparent; }
  .notice { border-radius:14px; }
  .hello { position:relative; overflow:hidden; background:linear-gradient(135deg,#ffd6e8 0%,#e0d4ff 55%,#c9f7ea 100%); box-shadow:0 6px 18px rgba(255,95,162,.25); }
  @media (prefers-color-scheme: dark) { .hello { background:linear-gradient(135deg,#5a2a54,#33296b 55%,#1f4a48); } }
  .hello::after { content:"✨"; position:absolute; right:10px; top:6px; font-size:1rem; animation:twinkle 2.4s ease-in-out infinite; }
  .hello .emo { font-size:2.2rem; animation:bounce 2.6s ease-in-out infinite; }
  .hello p { font-size:1rem; font-weight:600; }
  li { border-left:7px solid var(--c,#7c5cff); box-shadow:0 4px 14px rgba(60,40,120,.12); animation:pop .45s both; }
  li:nth-child(2){animation-delay:.05s} li:nth-child(3){animation-delay:.1s} li:nth-child(4){animation-delay:.15s}
  li:nth-child(5){animation-delay:.2s} li:nth-child(6){animation-delay:.25s} li:nth-child(7){animation-delay:.3s} li:nth-child(8){animation-delay:.35s}
  .badge { border-radius:99px; box-shadow:0 3px 8px rgba(0,0,0,.2); }
  .mins { color:var(--brand); }
  footer::before { content:"🌸 🎒 ✨ 🚌 ✨ 🎒 🌸"; display:block; margin-bottom:6px; letter-spacing:4px; opacity:.85; }
  #alert { display:none; }
  #alert.on { display:block; background:linear-gradient(135deg,#ff8a3d,#ff4d6d); color:#fff; border-radius:16px; padding:12px 14px; margin:0 0 12px; font-weight:800; font-size:1.05rem; box-shadow:0 6px 18px rgba(255,77,109,.4); animation:pulse 1.4s ease-in-out infinite; }
  #alert small { display:block; font-weight:600; opacity:.9; font-size:.85rem; margin-top:2px; }
  .vac { display:none; background:var(--card); border-radius:99px; padding:8px 14px; margin:-2px 0 12px; font-weight:700; font-size:.92rem; text-align:center; box-shadow:0 3px 10px rgba(60,40,120,.1); }
  .vac.on { display:block; }
  .cd { font-variant-numeric:tabular-nums; font-weight:800; color:var(--brand); }
  .cd.urgent { color:#e11d48; animation:pulse 1s ease-in-out infinite; display:inline-block; }
  .tag.last { background:#e11d48; color:#fff; border-color:transparent; margin:4px 0 0; }
  .share { display:block; width:100%; margin:14px 0 0; border:0; border-radius:99px; padding:12px 16px; font:inherit; font-weight:800; color:#fff; background:linear-gradient(135deg,#25d366,#128c7e); box-shadow:0 6px 16px rgba(18,140,126,.35); }
  .share:active { transform:scale(.98); }
  @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.03)} }
  @keyframes wiggle { 0%,100%{transform:rotate(0)} 10%{transform:rotate(-12deg)} 20%{transform:rotate(10deg)} 30%{transform:rotate(-6deg)} 40%{transform:rotate(0)} }
  @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-5px)} }
  @keyframes twinkle { 0%,100%{opacity:.3; transform:scale(.8)} 50%{opacity:1; transform:scale(1.2)} }
  @keyframes pop { from{opacity:0; transform:translateY(10px) scale(.98)} to{opacity:1; transform:none} }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation:none !important; transition:none !important; } }

  /* Bandeau du haut : uni, sans dégradé */
  header { background:var(--card); backdrop-filter:none; }
  @media (prefers-color-scheme: dark) { header { background:var(--card); } }
  /* Couleurs unies (sans dégradé) pour les boutons, l'alerte et le mot pour Margaux */
  .tabs button[aria-pressed="true"] { background:var(--violet); }
  .hello { background:#dff7ee; }
  @media (prefers-color-scheme: dark) { .hello { background:#1f3d38; } }
  #alert.on { background:#ff6b3d; }
  .share { background:#1fa855; }
  /* Infos trafic (métro ligne 1) */
  #traffic .alert-m1 { background:#fde8e6; color:#7a1610; border-left:6px solid #d92d20; border-radius:14px; padding:10px 12px; margin:0 0 12px; font-size:.92rem; line-height:1.35; }
  #traffic .alert-m1 b { display:block; font-size:.98rem; margin-bottom:2px; }
  #traffic .alert-m1 small { display:block; opacity:.75; margin-top:4px; }
  @media (prefers-color-scheme: dark) { #traffic .alert-m1 { background:#4a1d1a; color:#ffd7d2; } }
  .trafficline { font-size:.8rem; margin:0 0 6px; }
  .trafficline a { color:var(--brand); }
  /* ===== Palette « turquoise & corail », fond uni ===== */
  :root { --bg:#f3f7f8; --card:#fff; --text:#15252b; --muted:#5f7178; --line:#dde7ea;
          --brand:#0f766e; --brand-text:#fff; --violet:#0f766e; --mint:#bfe9e3; --coral:#f0654a; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0d1b1e; --card:#16292d; --text:#e6f1f2; --muted:#93aab0; --line:#243b40;
            --brand:#2dd4bf; --brand-text:#04211d; --violet:#2dd4bf; --mint:#134e4a; --coral:#ff8a6b; }
  }
  html, body, body { background:var(--bg) !important; }
  header { background:var(--card); box-shadow:0 2px 10px rgba(15,60,70,.08); }
  .tabs button[aria-pressed="true"] { background:var(--brand); color:var(--brand-text); box-shadow:0 4px 12px rgba(15,118,110,.3); }
  .tabs button[aria-pressed="true"] small { color:inherit; }
  .when-bar button[aria-pressed="true"] { background:var(--mint); color:var(--text); }
  .hello { background:#e6f3f2; color:var(--text); }
  @media (prefers-color-scheme: dark) { .hello { background:#183a3c; } }
  #alert.on { background:var(--coral); color:#fff; }
  .share { background:var(--brand); color:var(--brand-text); }
  .badge { box-shadow:0 2px 6px rgba(0,0,0,.15); }
  li { box-shadow:0 2px 8px rgba(15,60,70,.08); }
  .hello { box-shadow:0 2px 8px rgba(15,60,70,.1); }
  /* ===== Palette « vert sauge & terracotta » ===== */
  :root { --bg:#f5f6f1; --card:#fff; --text:#22291f; --muted:#666f61; --line:#e2e6da;
          --brand:#4f7053; --brand-text:#fff; --violet:#4f7053; --mint:#dbe7d6; --coral:#c4553c; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#141912; --card:#1e251c; --text:#e8eee3; --muted:#9aa591; --line:#2e372b;
            --brand:#a7cfa9; --brand-text:#10210f; --violet:#a7cfa9; --mint:#2f4a30; --coral:#e2785f; }
  }
  header { box-shadow:0 2px 10px rgba(50,70,45,.08); }
  .tabs button[aria-pressed="true"] { box-shadow:0 4px 12px rgba(79,112,83,.3); }
  .hello { background:#e8eee2; box-shadow:0 2px 8px rgba(50,70,45,.1); }
  @media (prefers-color-scheme: dark) { .hello { background:#243222; } }
  li { box-shadow:0 2px 8px rgba(50,70,45,.09); }
  #alert.on { background:var(--coral); }
  .cd.urgent { color:var(--coral); }
  .tag.last { background:var(--coral); }
  /* Présentation compacte des cartes */
  .badge { grid-row:span 2; }
  .when { grid-row:span 2; }
  .sub { grid-column:2; border-top:0; padding-top:0; margin-top:0; }
  .dur { font-size:.85rem; color:var(--muted); font-weight:600; white-space:nowrap; }
  /* Carte : ligne d'arrivée sur toute la largeur, sans débordement */
  .badge, .when { grid-row:auto; }
  .place { min-width:0; }
  .sub { grid-column:1 / -1; border-top:0; padding-top:2px; margin-top:0; min-width:0; overflow-wrap:anywhere; line-height:1.5; }
  .dur { white-space:normal; }
</style>
</head>
<body>
<header>
  <h1><span>Prochains bus</span><small id="status">chargement…</small></h1>
  <div class="tabs" role="group" aria-label="Sens du trajet">
    <button id="tab-to"   aria-pressed="true">Bouvines / Tournebride<small>→ 4 Cantons</small></button>
    <button id="tab-from" aria-pressed="false">4 Cantons<small>→ Bouvines / Tournebride</small></button>
  </div>
  <div class="when-bar">
    <button id="btn-now" aria-pressed="true">Maintenant</button>
    <button id="btn-custom" aria-pressed="false">Autre jour / heure…</button>
    <div id="custom"><input type="date" id="in-date" aria-label="Jour"><input type="time" id="in-time" aria-label="Heure"></div>
  </div>
</header>
<main>
  <div id="traffic" role="status"></div>
  <div class="hello" id="hello" title="Touche pour un autre message"><span class="emo" id="hello-emo"></span><p><b>Pour Margaux</b><span id="hello-txt"></span></p></div>
  <div id="alert" role="status"></div>
  <div class="vac" id="vac"></div>
  <div id="notice"></div>
  <ul id="list"></ul>
  <button class="share" id="share">📤 Envoyer les prochains bus sur WhatsApp</button>
</main>
<footer>
  Données : Région Hauts-de-France (open data), lignes 854 et 870.<br>
  <p class="trafficline" id="trafficline"><a href="https://www.ilevia.fr/infos-trafic" target="_blank" rel="noopener">Infos trafic Ilévia</a></p>
  <button id="refresh">Actualiser</button>
</footer>

<script>
"use strict";
const MAX_ITEMS = 8;
const $ = id => document.getElementById(id);

let DATA = null;            // horaires (data.json)
let dir = (() => { try { return localStorage.getItem("dir") === "from" ? "from" : "to"; } catch (e) { return "to"; } })();
const serviceSets = new Map();
let custom = false;         // false = maintenant, true = jour/heure choisis

async function loadSchedule() {
  const r = await fetch("data.json", { cache: "no-cache" });
  if (!r.ok) throw new Error("data.json " + r.status);
  DATA = await r.json();
  serviceSets.clear();
  for (const [k, v] of Object.entries(DATA.services)) serviceSets.set(k, new Set(v));
}

const ymd = d => d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate();
const at = (day, secs) => new Date(day.getFullYear(), day.getMonth(), day.getDate(), 0, 0, secs).getTime();

function upcoming(now) {
  const out = [];
  const list = DATA.items[dir];
  for (let off = -1; off <= 8; off++) {           // veille (courses après minuit) jusqu'à 8 jours plus tard
    const day = new Date(now.getFullYear(), now.getMonth(), now.getDate() + off);
    const key = ymd(day);
    for (const it of list) {
      const set = serviceSets.get(it.s);
      if (!set || !set.has(key)) continue;
      const t = at(day, it.d);
      if (t < now.getTime() - (custom ? 0 : 30e3)) continue;
      out.push({ it, t, k: key + '|' + it.p, dst: it.dst.map(([p, s]) => [DATA.places[p], at(day, s)]) });
    }
  }
  out.sort((a, b) => a.t - b.t);
  const lastT = {};                                   // dernier départ de chaque jour et de chaque arrêt
  for (const o of out) lastT[o.k] = Math.max(lastT[o.k] || 0, o.t);
  for (const o of out) o.last = o.t === lastT[o.k];
  return out.slice(0, MAX_ITEMS);
}

const hhmm = ms => new Date(ms).toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
const fmtDur = min => min < 60 ? min + " min" : Math.floor(min / 60) + " h " + String(min % 60).padStart(2, "0");
const label = n => esc(n);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const cap = s => s.split(" - ")[0].toLowerCase().replace(/(^|[ '-])(\S)/g, (m, a, b) => a + b.toUpperCase());  // "MOUCHIN - Place" -> "Mouchin"

function render() {
  if (!DATA) return;
  const now = refTime();
  const real = new Date();
  $("tab-to").setAttribute("aria-pressed", dir === "to");
  $("tab-from").setAttribute("aria-pressed", dir === "from");

  const notices = [];
  if (ymd(now) > DATA.validTo) notices.push("Les horaires enregistrés sont périmés : ouvrez l'appli avec du réseau pour les mettre à jour.");
  notices.push("Horaires théoriques (pas de temps réel sur les lignes 854 et 870).");
  $("notice").innerHTML = notices.map(n => `<div class="notice">${n}</div>`).join("");

  const rows = upcoming(now);
  ROWS = rows;
  NEXT = (!custom && rows.length) ? rows[0] : null;
  if (!rows.length) {
    $("list").innerHTML = `<li class="empty" style="display:block">Aucun passage prévu prochainement.</li>`;
  } else {
    $("list").innerHTML = rows.map(({ it, t, dst, last }, idx) => {
      const r = DATA.routes[it.r] || { n: it.r, c: "555555", t: "FFFFFF" };
      const mins = Math.max(0, Math.round((t - real.getTime()) / 60000));
      const wait = mins === 0 ? "maintenant" : mins < 60 ? "dans " + mins + " min" : mins < 1440 ? "dans " + Math.floor(mins / 60) + " h " + String(mins % 60).padStart(2, "0") : "";
      const dd = Math.round((new Date(t).setHours(0,0,0,0) - new Date(real).setHours(0,0,0,0)) / 864e5);
      const dayTxt = dd === 0 ? "" : dd === 1 ? "demain" : new Date(t).toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "short" });
      const arrive = dst.map(([n, ms]) => `<span class="nw">${label(n)} <b>${hhmm(ms)}</b></span> <span class="dur">· trajet ${fmtDur(Math.round((ms - t) / 60000))}</span>`).join("<br>");
      const towards = dir === "from" ? `<br><small>Direction ${esc(cap(it.h))}</small>` : "";
      return `<li style="--c:#${r.c}">
        <div class="badge" style="background:#${r.c};color:#${r.t}">${esc(r.n)}</div>
        <div class="place">${label(DATA.places[it.p])}</div>
        <div class="when"><div class="mins">${hhmm(t)}</div><div class="clock">${idx === 0 && !custom && t - real.getTime() < 3600e3 ? `dans <span class="cd" data-t="${t}"></span>` : [dayTxt, wait].filter(Boolean).join(" · ")}</div>${last ? '<span class="tag last">🏁 dernier bus</span>' : ""}</div>
        <div class="sub"><span class="nw">Arrivée :</span> ${arrive}${towards}</div>
      </li>`;
    }).join("");
  }
  renderVac(real);
  tick();
  $("status").textContent = custom ? "à partir du " + now.toLocaleDateString("fr-FR", { weekday: "short", day: "numeric", month: "short" }) + " " + hhmm(now.getTime()) : "mis à jour " + hhmm(real.getTime());
}

const pad = n => String(n).padStart(2, "0");
function refTime() {
  if (!custom) return new Date();
  const d = $("in-date").value, t = $("in-time").value;
  if (!d) return new Date();
  const [y, m, dd] = d.split("-").map(Number), [h, mi] = (t || "00:00").split(":").map(Number);
  return new Date(y, m - 1, dd, h, mi, 0);
}
function setCustom(on) {

  let i;
  do { i = Math.floor(Math.random() * pool.length); } while (pool.length > 1 && (cat + ":" + i) === localStorage_get("helloKey"));
  try { localStorage.setItem("helloKey", cat + ":" + i); } catch (e) {}
  const [emo, txt] = pool[i];
  $("hello-emo").textContent = emo;

/* ---------- Alerte « il faut partir », compte à rebours, vacances, partage ---------- */
let ROWS = [], NEXT = null;

function fmtCd(ms) {
  const s = Math.max(0, Math.floor(ms / 1000)), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), sec = s % 60;
  return h ? `${h}:${pad(m)}:${pad(sec)}` : `${m}:${pad(sec)}`;
}
function tick() {
  const now = Date.now();
  document.querySelectorAll(".cd").forEach(el => {
    const d = Number(el.dataset.t) - now;
    el.textContent = d <= 0 ? "maintenant" : fmtCd(d);
    el.classList.toggle("urgent", d < 600e3);
  });
  const a = $("alert");
  const d = NEXT ? NEXT.t - now : Infinity;
  if (NEXT && d <= 600e3 && d > -30e3) {
    const min = Math.max(0, Math.ceil(d / 60000));
    const r = DATA.routes[NEXT.it.r], place = DATA.places[NEXT.it.p];
    a.innerHTML = (d < 120e3 ? "🚨 Cours ! " : "🏃 Attrape ton sac ! ") + `Le bus ${esc(r ? r.n : NEXT.it.r)} part ${min <= 1 ? "dans moins d'une minute" : "dans " + min + " min"}` +
      `<small>${label(place)} · ${hhmm(NEXT.t)}</small>`;
    a.classList.add("on");
  } else a.classList.remove("on");
}
setInterval(tick, 1000);

const dayOnly = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const parseDay = iso => { const [y, m, dd] = iso.split("-").map(Number); return new Date(y, m - 1, dd); };
const nDays = (a, b) => Math.round((b - a) / 864e5);
const lower1 = s => s.replace(/^V/, "v");   // "Vacances de la Toussaint" -> "vacances de la Toussaint"

function renderVac(now) {
  const el = $("vac");
  if (!DATA || !DATA.holidays || !DATA.holidays.length) { el.classList.remove("on"); return; }
  const today = dayOnly(now);
  let txt = "";
  for (const h of DATA.holidays) {
    const from = parseDay(h.from), to = parseDay(h.to);
    if (today >= from && today < to) {
      txt = `🎉 C'est les vacances ! Reprise ${to.toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long" })}`;
      break;
    }
    if (today < from) {
      const n = nDays(today, from);
      txt = `🏖️ ${h.n} ${n === 1 ? "commencent demain !" : "dans " + n + " jours"}`;
      break;
    }
  }
  el.textContent = txt;
  el.classList.toggle("on", !!txt);
}

/* Jours spéciaux : anniversaire de Margaux (13 novembre), fêtes, vacances */
function specialHello(now) {
  const today = dayOnly(now), m = today.getMonth() + 1, d = today.getDate();
  let bday = new Date(today.getFullYear(), 10, 13);
  const toB = nDays(today, bday);
  if (toB === 0) return ["🎂", "JOYEUX ANNIVERSAIRE MARGAUX ! 🎉 Une année de plus, une année de mieux. Mamie t'embrasse très fort !"];
  if (toB === 1) return ["🎈", "Demain, c'est ton anniversaire, ma chérie ! Tu as déjà préparé ta plus belle tenue ?"];
  if (toB > 1 && toB <= 7) return ["🎁", `Plus que ${toB} jours avant ton anniversaire, Margaux ! Mamie compte les dodos avec toi.`];
  if (toB === -1) return ["🥳", "Bonne première journée de ta nouvelle année, ma Margaux !"];
  if (m === 12 && d === 24) return ["🎄", "C'est la veille de Noël ! Pense à laisser du lait et des biscuits pour le Père Noël."];
  if (m === 12 && d === 25) return ["🎅", "Joyeux Noël ma chérie ! Les plus beaux cadeaux sont ceux qui sont autour de la table."];
  if (m === 12 && d === 31) return ["🥂", "Dernier jour de l'année ! Tu as le droit de veiller un peu, mais pas jusqu'à l'aube."];
  if (m === 1 && d === 1) return ["🎆", "Bonne année, Margaux ! Que cette année te soit douce et pleine de belles surprises."];
  if (m === 10 && d === 31) return ["🎃", "Joyeux Halloween ! Attention aux fantômes dans le bus. Ils ne prennent jamais de ticket."];
  if (m === 4 && d === 1) return ["🐟", "Poisson d'avril ! Ne crois pas tout ce qu'on te dit aujourd'hui, même pas Mamie."];
  if (DATA && DATA.holidays) {
    for (const h of DATA.holidays) {
      const from = parseDay(h.from), to = parseDay(h.to), n = lower1(h.n);
      if (nDays(today, from) === 1) return ["🎉", `Dernier jour avant les ${n} ! Un petit effort et c'est la liberté !`];
      if (nDays(today, from) === 0) return ["🏖️", `C'est parti pour les ${n} ! Repose-toi bien, ma chérie.`];

        : ["📚", `Reprise après les ${n}. Courage, les prochaines arrivent vite !`];
    }
  }
  return null;
}

/* ---------- Infos trafic : perturbations du métro ligne 1 (et messages qui citent 4 Cantons) ---------- */
const TRAFFIC_URL = "https://data.lillemetropole.fr/geoserver/ogc/features/v1/collections/dsp_ilevia:perturbations/items?f=json&limit=200";
let TRAFFIC = { ok: false, items: [], at: 0 };

// Les heures de ce flux sont locales, même si elles finissent par « Z » : on retire le Z.
const localTime = iso => iso ? new Date(iso.replace(/Z$/, "")).getTime() : NaN;

// La « fin prévue » du flux est souvent automatique (= modification + 24 h) : elle n'est pas fiable.
// On lit donc l'heure dans le message (« jusque 12h55 environ »), sinon on limite la durée à 3 h.
function effectiveEnd(msg, mod, feedEnd) {
  const plain = msg.replace(/<[^>]+>/g, " ");
  const m = plain.match(/jusqu(?:e|')\s*(?:à\s*|a\s*)?(\d{1,2})\s*h\s*(\d{2})?/i);
  if (m && !isNaN(mod)) {
    const d = new Date(mod);
    d.setHours(Number(m[1]), Number(m[2] || 0), 0, 0);
    if (d.getTime() < mod - 10 * 60e3) d.setDate(d.getDate() + 1);           // « jusque 05h20 » dit à 23h50 : lendemain
    const t = d.getTime() + 20 * 60e3;                                        // + 20 min de marge (« environ »)
    return isNaN(feedEnd) ? t : Math.min(t, feedEnd);
  }
  if (/\b(du|à partir du|jusqu'au|le)\s+\d{1,2}(er)?\s+(\w+\s+)?(au|jusqu)/i.test(plain) || /\b\d{1,2}\s+(janvier|février|mars|avril|mai|juin|juillet|août|septembre|octobre|novembre|décembre)/i.test(plain)) return feedEnd;   // travaux datés
  const cap = isNaN(mod) ? Infinity : mod + 3 * 3600e3;
  return isNaN(feedEnd) ? cap : Math.min(feedEnd, cap);
}

async function loadTraffic() {
  try {
    const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), 8000);
    const r = await fetch(TRAFFIC_URL, { cache: "no-store", signal: ctl.signal });
    clearTimeout(to);
    if (!r.ok) throw new Error(r.status);
    const feats = (await r.json()).features || [];
    const now = Date.now(), seen = new Set(), items = [];
    for (const f of feats) {
      const p = f.properties || {}, msg = (p.message || "").trim();
      if (!msg || seen.has(msg)) continue;
      const m1 = /:ME1:/.test(p.cible || "") || /ligne 1 du m[ée]tro/i.test(msg);
      const cq = /4 Cantons|Pierre Mauroy/i.test(msg);
      if (!m1 && !cq) continue;
      const mod = localTime(p.date_modification);
      const end = effectiveEnd(msg, mod, localTime(p.heure_fin_prevue));
      const active = !isNaN(end) ? end > now : (now - mod) < 3 * 3600e3;   // fin dépassée = incident terminé
      if (!active) continue;
      seen.add(msg);
      items.push({ msg, end, mod, m1 });
    }
    items.sort((a, b) => b.mod - a.mod);
    TRAFFIC = { ok: true, items, at: now };
  } catch (e) { TRAFFIC = { ok: false, items: [], at: TRAFFIC.at }; }
  renderTraffic();
}

function renderTraffic() {
  const box = $("traffic"), line = $("trafficline");
  const link = '<a href="https://www.ilevia.fr/infos-trafic" target="_blank" rel="noopener">Infos trafic Ilévia</a>';
  if (!TRAFFIC.ok) {
    box.innerHTML = "";
    line.innerHTML = "Info trafic métro indisponible (pas de réseau ?) · " + link;
    return;
  }
  box.innerHTML = TRAFFIC.items.slice(0, 3).map(it =>
    `<div class="alert-m1"><b>⚠️ ${it.m1 ? "Métro ligne 1" : "Info trafic"}</b>${esc(it.msg)}` +
    (!isNaN(it.end) && it.end > Date.now() && it.end - Date.now() < 24 * 3600e3 ? `<small>Fin prévue vers ${hhmm(it.end)}</small>` : "") + `</div>`).join("");
  line.innerHTML = (TRAFFIC.items.length ? "" : `Métro ligne 1 : aucun incident signalé (${hhmm(TRAFFIC.at)}) · `) + link;
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) loadTraffic(); });
setInterval(() => { if (!document.hidden) loadTraffic(); }, 60000);
loadTraffic();


(async function init() {
