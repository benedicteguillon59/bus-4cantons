<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bus 4 Cantons</title>
<meta name="theme-color" content="#00427a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
  :root {
    --bg:#f2f5f9; --card:#fff; --text:#16202b; --muted:#65727f; --line:#e1e7ee;
    --brand:#00427a; --brand-text:#fff; --ok:#1a7f37; --late:#c2410c; --warn-bg:#fff4d6; --warn-text:#6b4e00;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0e141b; --card:#18212b; --text:#e8eef4; --muted:#93a1af; --line:#26313d;
            --brand:#4da3ff; --brand-text:#06213b; --ok:#4ade80; --late:#fb923c; --warn-bg:#3a2f0b; --warn-text:#f5d77a; }
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; background:var(--bg); color:var(--text);
    font:16px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  body { padding:0 0 env(safe-area-inset-bottom); min-height:100vh; }
  header { position:sticky; top:0; z-index:5; background:var(--bg); padding:12px 16px 10px; border-bottom:1px solid var(--line); }
  h1 { font-size:1.05rem; margin:0 0 10px; display:flex; justify-content:space-between; align-items:baseline; gap:8px; }
  h1 small { font-weight:400; color:var(--muted); font-size:.8rem; }
  .tabs { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .tabs button { border:2px solid var(--line); background:var(--card); color:var(--text); border-radius:14px;
    padding:12px 8px; font:inherit; font-weight:600; line-height:1.2; }
  .tabs button small { display:block; font-weight:400; color:var(--muted); font-size:.75rem; margin-top:2px; }
  .tabs button[aria-pressed="true"] { background:var(--brand); border-color:var(--brand); color:var(--brand-text); }
  .tabs button[aria-pressed="true"] small { color:inherit; opacity:.85; }
  main { padding:12px 16px 24px; max-width:640px; margin:0 auto; }
  .notice { background:var(--warn-bg); color:var(--warn-text); border-radius:12px; padding:10px 12px; margin:0 0 12px; font-size:.88rem; }
  ul { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:10px; }
  li { background:var(--card); border-radius:16px; padding:12px 14px; display:grid; grid-template-columns:auto 1fr auto; gap:4px 12px; align-items:center;
       box-shadow:0 1px 2px rgba(0,0,0,.06); }
  .badge { min-width:44px; text-align:center; padding:6px 8px; border-radius:10px; font-weight:800; font-size:1.05rem; }
  .place { font-weight:600; }
  .sub { color:var(--muted); font-size:1rem; grid-column:1 / -1; border-top:1px solid var(--line); padding-top:8px; margin-top:4px; }
  .sub b { color:var(--text); font-size:1.15rem; font-weight:700; }
  .nw { white-space:nowrap; }
  .sub small { font-size:.82rem; }
  .when { text-align:right; }
  .mins { font-size:1.5rem; font-weight:800; line-height:1; }
  .clock { color:var(--muted); font-size:.85rem; margin-top:2px; white-space:nowrap; }
    .late { color:var(--late); font-weight:600; }
  .tag { display:inline-block; font-size:.72rem; font-weight:700; padding:1px 7px; border-radius:99px; border:1px solid currentColor; margin-left:4px; vertical-align:1px; }
  .when-bar { margin-top:10px; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .when-bar button { border:2px solid var(--line); background:var(--card); color:var(--text); border-radius:12px; padding:8px 12px; font:inherit; font-size:.9rem; font-weight:600; }
  .when-bar button[aria-pressed="true"] { border-color:var(--brand); color:var(--brand); }
  .when-bar input { border:2px solid var(--line); background:var(--card); color:var(--text); border-radius:12px; padding:7px 8px; font:inherit; font-size:1rem; min-width:0; }
  #custom { display:none; gap:8px; flex:1 1 100%; }
  #custom.on { display:flex; }
  #custom input[type=date] { flex:1 1 55%; } #custom input[type=time] { flex:1 1 35%; }
  .hello { background:linear-gradient(135deg,#ffe3ef,#e6ecff); color:#2b2340; border-radius:16px; padding:12px 14px; margin:0 0 12px; display:flex; gap:10px; align-items:center; cursor:pointer; }
  @media (prefers-color-scheme: dark) { .hello { background:linear-gradient(135deg,#3b2a44,#1f2a4a); color:#f3eaff; } }
  .hello .emo { font-size:1.8rem; line-height:1; }
  .hello p { margin:0; font-size:.95rem; line-height:1.35; }
  .hello p b { display:block; font-size:.8rem; opacity:.7; font-weight:600; margin-bottom:2px; }
  .empty { text-align:center; color:var(--muted); padding:40px 0; }
  footer { text-align:center; color:var(--muted); font-size:.78rem; padding:0 16px 24px; }
  footer button { font:inherit; color:var(--brand); background:none; border:0; text-decoration:underline; padding:4px; }
</style>
</head>
<body>
<header>
  <h1><span>Prochains bus</span><small id="status">chargement…</small></h1>
  <div class="tabs" role="group" aria-label="Sens du trajet">
    <button id="tab-to"   aria-pressed="true">Bouvines / Tournebride<small>→ 4 Cantons</small></button>
    <button id="tab-from" aria-pressed="false">4 Cantons<small>→ Bouvines / Tournebride</small></button>
  </div>
  <div class="when-bar">
    <button id="btn-now" aria-pressed="true">Maintenant</button>
    <button id="btn-custom" aria-pressed="false">Autre jour / heure…</button>
    <div id="custom"><input type="date" id="in-date" aria-label="Jour"><input type="time" id="in-time" aria-label="Heure"></div>
  </div>
</header>
<main>
  <div class="hello" id="hello" title="Touche pour un autre message"><span class="emo" id="hello-emo"></span><p><b>Pour Margaux</b><span id="hello-txt"></span></p></div>
  <div id="notice"></div>
  <ul id="list"></ul>
</main>
<footer>
  Données : Région Hauts-de-France (open data), lignes 854 et 870.<br>
  <button id="refresh">Actualiser</button>
</footer>

<script>
"use strict";
const MAX_ITEMS = 8;
const $ = id => document.getElementById(id);

let DATA = null;            // horaires (data.json)
let dir = (() => { try { return localStorage.getItem("dir") === "from" ? "from" : "to"; } catch (e) { return "to"; } })();
const serviceSets = new Map();
let custom = false;         // false = maintenant, true = jour/heure choisis

async function loadSchedule() {
  const r = await fetch("data.json", { cache: "no-cache" });
  if (!r.ok) throw new Error("data.json " + r.status);
  DATA = await r.json();
  serviceSets.clear();
  for (const [k, v] of Object.entries(DATA.services)) serviceSets.set(k, new Set(v));
}

const ymd = d => d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate();
const at = (day, secs) => new Date(day.getFullYear(), day.getMonth(), day.getDate(), 0, 0, secs).getTime();

function upcoming(now) {
  const out = [];
  const list = DATA.items[dir];
  for (let off = -1; off <= 8; off++) {           // veille (courses après minuit) jusqu'à 8 jours plus tard
    const day = new Date(now.getFullYear(), now.getMonth(), now.getDate() + off);
    const key = ymd(day);
    for (const it of list) {
      const set = serviceSets.get(it.s);
      if (!set || !set.has(key)) continue;
      const t = at(day, it.d);
      if (t < now.getTime() - (custom ? 0 : 30e3)) continue;
      out.push({ it, t, dst: it.dst.map(([p, s]) => [DATA.places[p], at(day, s)]) });
    }
  }
  out.sort((a, b) => a.t - b.t);
  return out.slice(0, MAX_ITEMS);
}

const hhmm = ms => new Date(ms).toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const cap = s => s.split(" - ")[0].toLowerCase().replace(/(^|[ '-])(\S)/g, (m, a, b) => a + b.toUpperCase());  // "MOUCHIN - Place" -> "Mouchin"

function render() {
  if (!DATA) return;
  const now = refTime();
  const real = new Date();
  $("tab-to").setAttribute("aria-pressed", dir === "to");
  $("tab-from").setAttribute("aria-pressed", dir === "from");

  const notices = [];
  if (ymd(now) > DATA.validTo) notices.push("Les horaires enregistrés sont périmés : ouvrez l'appli avec du réseau pour les mettre à jour.");
  notices.push("Horaires théoriques (pas de temps réel sur les lignes 854 et 870).");
  $("notice").innerHTML = notices.map(n => `<div class="notice">${n}</div>`).join("");

  const rows = upcoming(now);
  if (!rows.length) {
    $("list").innerHTML = `<li class="empty" style="display:block">Aucun passage prévu prochainement.</li>`;
  } else {
    $("list").innerHTML = rows.map(({ it, t, dst }) => {
      const r = DATA.routes[it.r] || { n: it.r, c: "555555", t: "FFFFFF" };
      const mins = Math.max(0, Math.round((t - real.getTime()) / 60000));
      const wait = mins === 0 ? "maintenant" : mins < 60 ? "dans " + mins + " min" : mins < 1440 ? "dans " + Math.floor(mins / 60) + " h " + String(mins % 60).padStart(2, "0") : "";
      const dd = Math.round((new Date(t).setHours(0,0,0,0) - new Date(real).setHours(0,0,0,0)) / 864e5);
      const dayTxt = dd === 0 ? "" : dd === 1 ? "demain" : new Date(t).toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "short" });
      const arrive = dst.map(([n, ms]) => `<span class="nw">${esc(n)} <b>${hhmm(ms)}</b></span>`).join("<br>");
      const towards = dir === "from" ? `<br><small>Direction ${esc(cap(it.h))}</small>` : "";
      return `<li>
        <div class="badge" style="background:#${r.c};color:#${r.t}">${esc(r.n)}</div>
        <div class="place">${esc(DATA.places[it.p])}</div>
        <div class="when"><div class="mins">${hhmm(t)}</div><div class="clock">${[dayTxt, wait].filter(Boolean).join(" · ")}</div></div>
        <div class="sub"><span class="nw">Arrivée :</span> ${dst.length > 1 ? "<br>" : ""}${arrive}${towards}</div>
      </li>`;
    }).join("");
  }
  $("status").textContent = custom ? "à partir du " + now.toLocaleDateString("fr-FR", { weekday: "short", day: "numeric", month: "short" }) + " " + hhmm(now.getTime()) : "mis à jour " + hhmm(real.getTime());
}

const pad = n => String(n).padStart(2, "0");
function refTime() {
  if (!custom) return new Date();
  const d = $("in-date").value, t = $("in-time").value;
  if (!d) return new Date();
  const [y, m, dd] = d.split("-").map(Number), [h, mi] = (t || "00:00").split(":").map(Number);
  return new Date(y, m - 1, dd, h, mi, 0);
}
function setCustom(on) {
  custom = on;
  if (on && !$("in-date").value) {
    const n = new Date();
    $("in-date").value = `${n.getFullYear()}-${pad(n.getMonth() + 1)}-${pad(n.getDate())}`;
    $("in-time").value = `${pad(n.getHours())}:${pad(n.getMinutes())}`;
  }
  $("custom").classList.toggle("on", on);
  $("btn-now").setAttribute("aria-pressed", !on);
  $("btn-custom").setAttribute("aria-pressed", on);
  render();
}
$("btn-now").onclick = () => setCustom(false);
$("btn-custom").onclick = () => setCustom(true);
$("in-date").onchange = $("in-time").onchange = () => { custom = true; render(); };

function setDir(d) {
  dir = d;
  try { localStorage.setItem("dir", d); } catch (e) {}
  render();
}

$("tab-to").onclick = () => setDir("to");
$("tab-from").onclick = () => setDir("from");
$("refresh").onclick = async () => { try { await loadSchedule(); } catch (e) {} render(); };

document.addEventListener("visibilitychange", () => { if (!document.hidden) render(); });
setInterval(render, 15000);                                   // met à jour les « dans X min »


/* ---------- Petit mot pour Margaux (change à chaque ouverture) ---------- */
const HELLO = {
  matin: [
    ["🧣", "Mets ton écharpe, ma chérie ! Il fait plus frais qu'on ne le croit."],
    ["🥣", "As-tu bien mangé ton petit-déjeuner ? Un ventre vide, ça fait des idées noires."],
    ["🚌", "Le bus part à l'heure, et il ne t'attendra pas si tu traînes devant le miroir."],
    ["🎒", "As-tu pris ton sac, ton cahier, ton téléphone chargé et ton plus beau sourire ?"],
    ["🌞", "Debout là-dedans ! Le soleil s'est levé pour toi, la moindre des politesses c'est de lui répondre."],
    ["🧤", "Prends une veste, on ne sait jamais. De mon temps, on attrapait froid pour moins que ça."],
    ["📚", "Aujourd'hui tu apprends quelque chose de nouveau. Et ce soir tu me raconteras, promis ?"],
    ["🍎", "Une pomme dans le sac, c'est comme un petit câlin de Mamie pour la récré."],
    ["💤", "Je sais, le lit était trop bon. Mais le lycée ne va pas se faire tout seul."],
    ["👵", "Une lycéenne qui prend le bus toute seule, si ta mamie voyait ça ! Attends... c'est moi. Bravo ma puce !"],
    ["🐓", "Le coq a chanté depuis longtemps. Toi aussi, tu peux te lever !"],
    ["🎀", "Bien coiffée, bien réveillée : on ne dirait jamais que tu t'es couchée tard."],
    ["🧦", "Vérifie que tes chaussettes sont assorties. On a toutes vécu ça, ce n'est pas grave."],
    ["✨", "Aujourd'hui, ce sera une belle journée. Mamie l'a décidé, donc c'est comme ça."],
    ["🌂", "Regarde le ciel avant de sortir : un parapluie, ça ne pèse pas lourd."],
  ],
  jour: [
    ["📖", "Écoute bien la prof, ma chérie. Et si tu ne comprends pas, lève la main, il n'y a pas de honte."],
    ["🍫", "Un petit carré de chocolat pour tenir jusqu'au goûter ? Mamie n'a rien vu."],
    ["🧠", "Tu as une bonne tête, ma Margaux. Sers-t'en, mais pas trop fort, elle a besoin de repos."],
    ["👀", "Ne regarde pas trop ton téléphone en cours, hein. Je le saurai, j'ai mes informateurs."],
    ["🍽️", "As-tu mangé à la cantine ? Une jeune fille, ça doit manger des légumes."],
    ["🕐", "Le temps passe vite quand on s'amuse, mais encore plus vite quand on est en retard."],
    ["🤓", "Les notes, ce n'est pas tout. Le principal, c'est d'avoir fait de son mieux et d'avoir ri un peu."],
    ["🎨", "À ton âge, j'avais déjà de grandes idées. Toi, tu en as de meilleures, j'en suis sûre."],
    ["🥪", "Le ventre qui gargouille, c'est le signe qu'il est l'heure de manger. Ne le fais pas attendre."],
    ["📝", "Écris lisiblement, ma chérie. Même les profs ont le droit d'être contents."],
    ["🫶", "Sois gentille avec tes camarades, et un peu moins gentille avec ceux qui ne le méritent pas."],
    ["😄", "Un rire par jour, c'est la meilleure médecine. Trouves-en un aujourd'hui."],
    ["💧", "Bois de l'eau, ma puce. Pas seulement du sirop ou des boissons en canette."],
    ["🚶‍♀️", "Marche droit et regarde devant toi : les jolies filles n'ont pas besoin de regarder leurs pieds."],
  ],
  soir: [
    ["🏡", "Te voilà rentrée ! As-tu passé une bonne journée ? Raconte tout à Mamie."],
    ["🍲", "Ce soir, on mange un bon repas chaud. Après une journée de lycée, tu l'as bien mérité."],
    ["🧦", "Enlève tes chaussures, mets des chaussons et reprends des forces."],
    ["📵", "Repose ton téléphone une petite heure. Tes yeux n'ont pas besoin de tant d'écran."],
    ["🛁", "Un bon bain chaud, une histoire qui te plaît, et hop, direction les bras de Morphée."],
    ["📚", "Les devoirs d'abord, les écrans ensuite. C'est la règle de Mamie, elle marche depuis toujours."],
    ["🌙", "Ne te couche pas trop tard. Le sommeil, c'est la moitié de la réussite."],
    ["☕", "Une petite tisane, un plaid, et le monde te semblera plus doux."],
    ["🧶", "Une journée de plus bien remplie ! Tu es une vraie championne."],
    ["❤️", "Je pense à toi, ma chérie. Tu es la plus jolie petite-fille du monde, mais ne le répète pas aux autres."],
    ["🍰", "Un petit bout de gâteau avant de dormir ? Mamie a peut-être un secret dans le placard."],
    ["🛏️", "Ton lit t'attend depuis ce matin. Ne le fais pas patienter davantage."],
    ["🌟", "Demain sera un autre jour, et il sera aussi bien que celui-ci. Dors bien."],
    ["📞", "Un petit coup de fil à Mamie ce soir ? Elle adore quand tu lui racontes ta journée."],
    ["🥰", "Bonne soirée, ma puce. Ne rentre jamais trop tard, et prends soin de toi."],
  ],
  weekend: [
    ["🎉", "C'est le week-end ! Profite, ma chérie, mais n'oublie pas de manger correctement."],
    ["🛌", "Grasse matinée autorisée. Un peu. Pas jusqu'à quatre heures de l'après-midi."],
    ["🛍️", "Une sortie en ville ? Prends un bon manteau, ne rentre pas trop tard et donne des nouvelles."],
    ["🍪", "Le week-end, on peut faire des gâteaux. Et les manger. Surtout les manger."],
    ["🎬", "Un bon film, un plaid et des amis : la recette du bonheur, selon Mamie."],
    ["🌳", "Un petit tour dehors te fera du bien. L'air frais, ça remet les idées en place."],
    ["👭", "Amuse-toi bien avec tes copines. Mais pas de bêtises, ou alors de toutes petites."],
    ["📞", "Le dimanche, c'est le jour où on appelle sa grand-mère. Juste pour dire bonjour."],
    ["🧺", "Un peu d'aide à la maison, ça n'a jamais fait de mal. Et Mamie sera contente."],
    ["☀️", "Deux jours sans lycée ! Profites-en comme il se doit."],
  ],
  tous: [
    ["👵", "De mon temps, on faisait des kilomètres à pied pour aller à l'école. Toi, tu as le bus : profite !"],
    ["🍀", "Un trèfle à quatre feuilles, ça porte bonheur. Mais un bon sourire, c'est encore mieux."],
    ["🦋", "Tu es en train de devenir une belle jeune femme. Je suis fière de toi, ma Margaux."],
    ["🎁", "Le plus beau cadeau, c'est de te voir grandir. Le reste, c'est du bonus."],
    ["🧡", "Quoi qu'il arrive, Mamie est là. Toujours. Même quand tu pars au lycée."],
    ["🕰️", "Quinze ans déjà ! Hier tu jouais à la poupée, aujourd'hui tu as un abonnement de bus."],
    ["🙌", "Ne te compare pas aux autres, ma chérie. Tu es un modèle unique, pas une photocopie."],
    ["🐢", "La tortue arrive toujours à destination. Pas besoin de courir tout le temps."],
    ["🌷", "Il faut du temps pour que les fleurs poussent. Sois patiente avec toi-même."],
    ["🧵", "Un point à la fois, on finit toujours par terminer sa broderie. Et sa journée aussi."],
    ["🍬", "Il y a toujours des bonbons au fond de mon sac. Tu le sais, tu n'as qu'à demander."],
    ["😉", "Mamie a des yeux dans le dos. Mais elle a surtout une grande confiance en toi."],
    ["🌍", "Le monde est grand, ma puce. Va le voir, mais donne des nouvelles !"],
    ["🥇", "Tu es la championne de ma vie. Même si tu rates ton bus."],
    ["🗝️", "Le secret d'une bonne vie : de bons amis, de bons repas et un peu de sieste."],
    ["💌", "Un jour, tu me diras merci de t'avoir dit tout ça. En attendant, mets ton bonnet !"],
    ["🐿️", "Petit à petit, l'écureuil fait son nid. Petit à petit, tu feras de grandes choses."],
    ["🎂", "Tu as toute la vie devant toi, ma Margaux, et Mamie a tout le temps de te regarder l'attraper."],
    ["📅", "Chaque jour, une nouvelle occasion de rire. Ne la laisse pas passer."],
    ["🤗", "Un gros câlin de Mamie, à emporter dans le bus."],
  ],
};
function pickHello() {
  const n = new Date(), h = n.getHours(), wd = n.getDay();
  const cat = (wd === 0 || wd === 6) ? "weekend" : h < 10 ? "matin" : h < 17 ? "jour" : "soir";
  const pool = HELLO[cat].concat(HELLO.tous);
  let i;
  do { i = Math.floor(Math.random() * pool.length); } while (pool.length > 1 && (cat + ":" + i) === localStorage_get("helloKey"));
  try { localStorage.setItem("helloKey", cat + ":" + i); } catch (e) {}
  const [emo, txt] = pool[i];
  $("hello-emo").textContent = emo;
  $("hello-txt").textContent = txt;
}
function localStorage_get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
$("hello").onclick = pickHello;
pickHello();

(async function init() {
  try { await loadSchedule(); } catch (e) { $("status").textContent = "horaires indisponibles"; return; }
  render();
})();

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
